name: Cleanup merged branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged pull request branches
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository?.default_branch ?? "main";
            const repositoryName = owner + "/" + repo;

            const [closedPulls, openPulls] = await Promise.all([
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "closed",
                base: defaultBranch,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              }),
            ]);

            const mergedBranches = new Set(
              closedPulls
                .filter((pull) =>
                  pull.merged_at &&
                  pull.head.repo?.full_name === repositoryName &&
                  pull.base.ref === defaultBranch
                )
                .map((pull) => pull.head.ref)
            );

            const branchesWithOpenPullRequests = new Set(
              openPulls
                .filter((pull) => pull.head.repo?.full_name === repositoryName)
                .map((pull) => pull.head.ref)
            );

            const candidates = [...mergedBranches]
              .filter((branch) =>
                branch !== defaultBranch &&
                !branchesWithOpenPullRequests.has(branch)
              )
              .sort();

            if (candidates.length === 0) {
              core.info("No merged branches to clean up.");
              return;
            }

            let deleted = 0;
            for (const branch of candidates) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: "heads/" + branch,
                });
                deleted += 1;
                core.info("Deleted merged branch: " + branch);
              } catch (error) {
                if (error.status === 404) {
                  core.info("Branch already absent: " + branch);
                  continue;
                }
                throw error;
              }
            }

            core.info("Deleted " + deleted + " merged branch(es).");
